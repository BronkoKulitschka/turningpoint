<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#30261d">
  <meta name="description" content="Turning Point – A Workshop Story. Deine Werkstattgeschichte beginnt hier.">
  <title>Turning Point – A Workshop Story</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=008">
  <link rel="stylesheet" href="./workshop.css?v=008">
  <script type="module" src="./src/app.js?v=008"></script>
</head>
<body>
  <div id="workshop-app" hidden></div>
  <main class="workbench" aria-label="Turning Point Spielmenü">
    <div class="bench-details" aria-hidden="true">
      <div class="bench-plate"><span>H. WAGNER</span><small>MECHANIK &amp; DREHTEILE · SEIT 1968</small></div>
      <figure class="old-photo"><img src="./assets/workshop.svg" alt=""><figcaption>Die Werkstatt. Alles hat seine Zeit.</figcaption></figure>
      <div class="coffee-ring"></div><div class="pencil"></div>
      <img class="bench-tools" src="./assets/bench-tools.svg" alt="">
      <span class="bench-mark">Ø 20 H7<br>Maße prüfen!</span>
    </div>
    <section class="clipboard" aria-label="Holzklemmbrett mit Spielmenü">
      <div class="metal-clip" aria-hidden="true"><span class="clip-loop"></span><span class="clip-screw left"></span><span class="clip-screw right"></span></div>
      <div class="paper-stack">
        <div class="paper">
          <header class="paper-heading"><div class="workshop-line">WERKSTATT WAGNER <span>BLATT NR. 008</span></div><h1>TURNING <em>POINT</em></h1><p>A WORKSHOP STORY</p><span class="ink-stamp" aria-hidden="true">ECHTES<br>HANDWERK</span></header>
          <div class="form-heading"><span>WERKSTATTUNTERLAGEN</span><span id="page-number">01 / START</span></div>
          <div id="panel" tabindex="-1"></div>
          <div class="paper-bottom"><span class="status-dot" aria-hidden="true"></span><span id="storage-status">Spielstände auf diesem Gerät.</span></div>
        </div>
      </div>
      <div class="board-bottom" aria-hidden="true"><span>H.W.</span><span>NICHT WEGWERFEN</span><span>1968</span></div>
    </section>
    <span class="build-mark">PROTOTYP 0.6.0 · UPDATE 008</span>
  </main>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>Bitte JavaScript aktivieren, damit du Spielstände laden und speichern kannst.</noscript>
</body>
</html>
